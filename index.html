<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>海底光影舞 MVP</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #061721;
        color: #eefcff;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      video {
        display: none;
      }

      #camera.debugCamera {
        display: block;
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 5;
        width: min(28vw, 320px);
        min-width: 180px;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        border: 1px solid rgba(177, 244, 255, 0.36);
        border-radius: 8px;
        background: #061721;
        box-shadow: 0 16px 44px rgba(0, 0, 0, 0.35);
        transform: scaleX(-1);
        pointer-events: none;
      }

      .hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .bar {
        position: absolute;
        top: 16px;
        left: 16px;
        right: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .controls,
      .readout {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 8px;
        border: 1px solid rgba(177, 244, 255, 0.28);
        border-radius: 8px;
        background: rgba(3, 24, 32, 0.64);
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(12px);
      }

      button {
        appearance: none;
        border: 1px solid rgba(202, 253, 255, 0.36);
        border-radius: 6px;
        min-height: 34px;
        padding: 0 12px;
        color: #f4feff;
        background: rgba(20, 117, 124, 0.68);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }

      button:hover {
        background: rgba(33, 146, 145, 0.82);
      }

      button:disabled {
        cursor: default;
        opacity: 0.52;
      }

      .small {
        width: 34px;
        padding: 0;
        font-size: 16px;
      }

      .status {
        min-width: 104px;
        font-size: 14px;
        color: #d8fbff;
      }

      .meter {
        width: 92px;
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
      }

      .meter > span {
        display: block;
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #7df3ff, #fff19a, #ff91bf);
      }

      .centerPrompt {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(560px, calc(100vw - 32px));
        padding: 22px 22px 20px;
        border: 1px solid rgba(206, 251, 255, 0.26);
        border-radius: 8px;
        background: rgba(3, 27, 38, 0.72);
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.35);
        text-align: center;
        backdrop-filter: blur(14px);
        pointer-events: auto;
      }

      .centerPrompt h1 {
        margin: 0 0 10px;
        font-size: clamp(26px, 5vw, 44px);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .centerPrompt p {
        margin: 0 0 16px;
        color: #c8f3f7;
        font-size: 15px;
        line-height: 1.6;
      }

      .centerPrompt .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 640px) {
        .bar {
          align-items: stretch;
          flex-direction: column;
        }

        .controls,
        .readout {
          width: 100%;
          justify-content: center;
        }

        .status {
          min-width: 80px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <video id="camera" autoplay muted playsinline></video>

    <div class="hud">
      <div class="bar">
        <div class="controls">
          <button id="cameraBtn">摄像头</button>
          <button id="demoBtn">演示</button>
          <button id="debugBtn">调试</button>
          <button id="soundBtn" class="small" aria-label="声音">♪</button>
        </div>
        <div class="readout">
          <span id="status" class="status">待开始</span>
          <div class="meter" aria-hidden="true"><span id="energyBar"></span></div>
        </div>
      </div>

      <section id="prompt" class="centerPrompt">
        <h1>海底光影舞</h1>
        <p>读取玩家骨骼，驱动卡通影子角色；倒计时结束后，聚光灯像手电筒一样晃动，让影子角色跳起来。</p>
        <div class="actions">
          <button id="startBtn">开始</button>
          <button id="promptDemoBtn">演示模式</button>
        </div>
      </section>
    </div>

    <script type="module">
      const canvas = document.querySelector("#stage");
      const ctx = canvas.getContext("2d");
      const video = document.querySelector("#camera");
      const startBtn = document.querySelector("#startBtn");
      const cameraBtn = document.querySelector("#cameraBtn");
      const demoBtn = document.querySelector("#demoBtn");
      const promptDemoBtn = document.querySelector("#promptDemoBtn");
      const debugBtn = document.querySelector("#debugBtn");
      const soundBtn = document.querySelector("#soundBtn");
      const promptPanel = document.querySelector("#prompt");
      const promptText = promptPanel.querySelector("p");
      const statusLabel = document.querySelector("#status");
      const energyBar = document.querySelector("#energyBar");

      const DPR_LIMIT = 2;
      const MAX_PLAYERS = 4;
      const TASKS_VERSION = "0.10.32";
      const LOST_PLAYER_HOLD_MS = 650;
      const DANCE_POSE_SAMPLE_MS = 1000;
      const SWAY_PERIOD_MS = 1000;
      const POSE_MODEL_URL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task";

      let width = 1;
      let height = 1;
      let dpr = 1;
      let startedAt = 0;
      let lastTime = 0;
      let state = "idle";
      let demoMode = false;
      let cameraReady = false;
      let modelReady = false;
      let modelLoading = false;
      let modelError = "";
      let poseLandmarker = null;
      let lastVideoTime = -1;
      let lastPoseSampleAt = -Infinity;
      let debugMode = false;
      let soundEnabled = true;
      let countdownDone = false;
      let motionEnergy = 0;
      let rippleCooldown = 0;
      let audio = null;
      let bubbles = [];
      let kelp = [];
      let players = [];
      let smoothedPlayers = [];

      const palette = [
        { body: "rgba(22, 26, 31, 0.94)", edge: "rgba(145, 238, 246, 0.42)", accent: "#7df3ff" },
        { body: "rgba(28, 24, 34, 0.94)", edge: "rgba(255, 181, 213, 0.36)", accent: "#ff91bf" },
        { body: "rgba(25, 29, 25, 0.94)", edge: "rgba(255, 231, 153, 0.36)", accent: "#fff19a" },
        { body: "rgba(22, 31, 34, 0.94)", edge: "rgba(166, 255, 197, 0.34)", accent: "#a5ffc5" }
      ];

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, DPR_LIMIT);
        width = Math.floor(window.innerWidth * dpr);
        height = Math.floor(window.innerHeight * dpr);
        canvas.width = width;
        canvas.height = height;
        buildSceneDetails();
      }

      function buildSceneDetails() {
        bubbles = Array.from({ length: 46 }, (_, i) => ({
          x: Math.random() * width,
          y: Math.random() * height,
          r: (2 + Math.random() * 7) * dpr,
          speed: (12 + Math.random() * 38) * dpr,
          wobble: Math.random() * Math.PI * 2,
          alpha: 0.18 + Math.random() * 0.4,
          hue: i % 5 === 0 ? "255, 231, 153" : "162, 246, 255"
        }));

        kelp = Array.from({ length: 18 }, (_, i) => ({
          x: ((i + Math.random() * 0.5) / 18) * width,
          h: (95 + Math.random() * 145) * dpr,
          w: (12 + Math.random() * 15) * dpr,
          phase: Math.random() * Math.PI * 2,
          color: i % 3 === 0 ? "#2aa084" : i % 3 === 1 ? "#5aab6b" : "#288d99"
        }));
      }

      async function startCamera() {
        promptPanel.classList.add("hidden");
        statusLabel.textContent = "加载骨骼";
        demoMode = false;
        cameraReady = false;
        modelError = "";
        syncDebugVideo();
        try {
          await loadPoseModel();
          statusLabel.textContent = "打开摄像头";
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              width: { ideal: 960 },
              height: { ideal: 540 },
              facingMode: "user"
            },
            audio: false
          });
          video.srcObject = stream;
          await video.play();
          cameraReady = true;
          syncDebugVideo();
          beginRound();
        } catch (error) {
          cameraReady = false;
          demoMode = false;
          state = "idle";
          promptPanel.classList.remove("hidden");
          modelError = error && error.message ? error.message : "pose unavailable";
          statusLabel.textContent = modelReady ? "摄像头失败" : "模型失败";
          showPromptDetail(modelReady ? "摄像头权限或设备打开失败，请检查浏览器授权。" : `骨骼模型加载失败：${shortError(modelError)}`);
        }
      }

      async function loadPoseModel() {
        if (modelReady || poseLandmarker) return;
        if (modelLoading) {
          while (modelLoading) await new Promise((resolve) => setTimeout(resolve, 120));
          return;
        }
        modelLoading = true;
        try {
          const { FilesetResolver, PoseLandmarker } = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${TASKS_VERSION}/vision_bundle.mjs`);
          const vision = await FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${TASKS_VERSION}/wasm`);
          const options = {
            baseOptions: {
              modelAssetPath: POSE_MODEL_URL,
              delegate: "GPU"
            },
            runningMode: "VIDEO",
            numPoses: MAX_PLAYERS,
            minPoseDetectionConfidence: 0.38,
            minPosePresenceConfidence: 0.38,
            minTrackingConfidence: 0.35
          };
          try {
            poseLandmarker = await PoseLandmarker.createFromOptions(vision, options);
          } catch (error) {
            options.baseOptions.delegate = "CPU";
            poseLandmarker = await PoseLandmarker.createFromOptions(vision, options);
          }
          modelReady = true;
          modelError = "";
        } finally {
          modelLoading = false;
        }
      }

      function beginDemo() {
        promptPanel.classList.add("hidden");
        showPromptDetail("读取玩家骨骼，驱动卡通影子角色；倒计时结束后，聚光灯像手电筒一样晃动，让影子角色跳起来。");
        cameraReady = false;
        demoMode = true;
        syncDebugVideo();
        beginRound();
      }

      function beginRound() {
        startedAt = performance.now();
        lastTime = startedAt;
        state = "countdown";
        countdownDone = false;
        motionEnergy = 0;
        rippleCooldown = 0;
        players = [];
        smoothedPlayers = [];
        lastPoseSampleAt = -Infinity;
        if (audio && audio.timer) {
          clearInterval(audio.timer);
          audio.timer = null;
          audio.step = 0;
        }
        ensureAudio();
      }

      function ensureAudio() {
        if (audio || !soundEnabled) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctxAudio = new AudioCtx();
        const master = ctxAudio.createGain();
        master.gain.value = 0.18;
        master.connect(ctxAudio.destination);
        audio = { ctx: ctxAudio, master, step: 0, timer: null };
        if (ctxAudio.state === "suspended") ctxAudio.resume();
      }

      function startMusic() {
        if (!audio || audio.timer) return;
        if (audio.ctx.state === "suspended") audio.ctx.resume();
        audio.timer = window.setInterval(() => scheduleBeat(audio.step++), 250);
        scheduleBeat(audio.step++);
      }

      function scheduleBeat(step) {
        if (!audio || !soundEnabled) return;
        const t = audio.ctx.currentTime;
        if (step % 4 === 0) playKick(t);
        if (step % 2 === 1) playHat(t);
        if (step % 8 === 0 || step % 8 === 3) playPluck(t, step % 8 === 0 ? 196 : 247);
      }

      function playKick(t) {
        const osc = audio.ctx.createOscillator();
        const gain = audio.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(120, t);
        osc.frequency.exponentialRampToValueAtTime(42, t + 0.16);
        gain.gain.setValueAtTime(0.72, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        osc.connect(gain).connect(audio.master);
        osc.start(t);
        osc.stop(t + 0.2);
      }

      function playHat(t) {
        const buffer = audio.ctx.createBuffer(1, audio.ctx.sampleRate * 0.045, audio.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const noise = audio.ctx.createBufferSource();
        const filter = audio.ctx.createBiquadFilter();
        const gain = audio.ctx.createGain();
        noise.buffer = buffer;
        filter.type = "highpass";
        filter.frequency.value = 5200;
        gain.gain.setValueAtTime(0.14, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
        noise.connect(filter).connect(gain).connect(audio.master);
        noise.start(t);
      }

      function playPluck(t, freq) {
        const osc = audio.ctx.createOscillator();
        const gain = audio.ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0, t);
        gain.gain.linearRampToValueAtTime(0.16, t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        osc.connect(gain).connect(audio.master);
        osc.start(t);
        osc.stop(t + 0.24);
      }

      function playRipple() {
        if (!audio || !soundEnabled) return;
        const t = audio.ctx.currentTime;
        const osc = audio.ctx.createOscillator();
        const filter = audio.ctx.createBiquadFilter();
        const gain = audio.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(360 + Math.random() * 180, t);
        osc.frequency.exponentialRampToValueAtTime(150 + Math.random() * 70, t + 0.34);
        filter.type = "lowpass";
        filter.frequency.value = 920;
        gain.gain.setValueAtTime(0.0, t);
        gain.gain.linearRampToValueAtTime(0.18, t + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
        osc.connect(filter).connect(gain).connect(audio.master);
        osc.start(t);
        osc.stop(t + 0.4);
      }

      function updatePlayers(now) {
        const shouldSamplePose = state !== "dancing" || players.length === 0 || now - lastPoseSampleAt >= DANCE_POSE_SAMPLE_MS;
        if (demoMode) {
          if (shouldSamplePose) {
            players = demoPlayers(now);
            if (state === "dancing") lastPoseSampleAt = now;
          }
        } else if (cameraReady && modelReady && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
          if (shouldSamplePose) {
            lastVideoTime = video.currentTime;
            const result = poseLandmarker.detectForVideo(video, now);
            players = (result.landmarks || []).slice(0, MAX_PLAYERS).map((landmarks, index) => poseToCharacter(landmarks, index, now));
            if (state === "dancing") lastPoseSampleAt = now;
          }
        } else if (!demoMode && state === "dancing") {
          statusLabel.textContent = modelError ? "模型失败" : "识别中";
        }

        smoothedPlayers = smoothPlayers(smoothedPlayers, players, now);
        const visible = smoothedPlayers.filter((player) => player.visible);
        if (state === "dancing" && (demoMode || cameraReady)) statusLabel.textContent = demoMode ? "演示舞动" : `${visible.length} 人`;
      }

      function poseToCharacter(landmarks, index, now) {
        const point = (id) => {
          const lm = landmarks[id];
          if (!lm || (lm.visibility !== undefined && lm.visibility < 0.18)) return null;
          return {
            x: clamp(1 - lm.x, -0.12, 1.12),
            y: clamp(lm.y, -0.15, 1.2),
            z: lm.z || 0
          };
        };
        const nose = point(0);
        const lShoulder = point(11);
        const rShoulder = point(12);
        const lElbow = point(13);
        const rElbow = point(14);
        const lWrist = point(15);
        const rWrist = point(16);
        const lHip = point(23);
        const rHip = point(24);
        const lKnee = point(25);
        const rKnee = point(26);
        const lAnkle = point(27);
        const rAnkle = point(28);

        const shoulderCenter = mid(lShoulder, rShoulder);
        const hipCenter = mid(lHip, rHip);
        const center = mid(shoulderCenter, hipCenter) || shoulderCenter || hipCenter || nose;
        const rawPoints = { nose, lShoulder, rShoulder, lElbow, rElbow, lWrist, rWrist, lHip, rHip, lKnee, rKnee, lAnkle, rAnkle };
        const bounds = pointBounds(Object.values(rawPoints));
        const bodySpan = clamp(bounds.h || 0.45, 0.2, 0.9);
        const scale = clamp(bodySpan * height * 0.78, 135 * dpr, 310 * dpr);
        const completedPoints = completePosePoints(rawPoints, center || { x: (index + 1) / 5, y: 0.58 }, bodySpan);

        return {
          index,
          visible: Boolean(center && shoulderCenter && hipCenter),
          center: center || { x: (index + 1) / 5, y: 0.58 },
          scale,
          lastSeen: now,
          points: localizePoints(completedPoints, center || { x: 0.5, y: 0.58 }, bodySpan)
        };
      }

      function demoPlayers(now) {
        const t = now * 0.001;
        return Array.from({ length: 3 }, (_, index) => {
          const baseX = (index + 1) / 4;
          const center = { x: baseX + Math.sin(t * 0.8 + index) * 0.035, y: 0.55 + Math.sin(t * 0.7 + index) * 0.03 };
          const scale = (118 + Math.sin(t + index) * 12) * dpr;
          const liftL = Math.sin(t * 2.4 + index) * 0.14;
          const liftR = Math.cos(t * 2.2 + index) * 0.14;
          const stepL = Math.sin(t * 1.7 + index) * 0.07;
          const stepR = Math.cos(t * 1.7 + index) * 0.07;
          return {
            index,
            visible: true,
            center,
            scale: 245 * dpr,
            lastSeen: now,
            points: {
              nose: { x: 0, y: -0.46 },
              lShoulder: { x: -0.22, y: -0.22 },
              rShoulder: { x: 0.22, y: -0.22 },
              lElbow: { x: -0.38, y: -0.08 - liftL },
              rElbow: { x: 0.38, y: -0.08 - liftR },
              lWrist: { x: -0.48, y: 0.08 - liftL * 1.25 },
              rWrist: { x: 0.48, y: 0.08 - liftR * 1.25 },
              lHip: { x: -0.15, y: 0.12 },
              rHip: { x: 0.15, y: 0.12 },
              lKnee: { x: -0.18 + stepL, y: 0.34 },
              rKnee: { x: 0.18 + stepR, y: 0.34 },
              lAnkle: { x: -0.2 + stepL * 1.2, y: 0.56 },
              rAnkle: { x: 0.2 + stepR * 1.2, y: 0.56 }
            }
          };
        });
      }

      function smoothPlayers(previous, next, now) {
        const used = new Set();
        const smoothed = next.map((player, slot) => {
          let bestIndex = -1;
          let bestDistance = Infinity;
          for (let i = 0; i < previous.length; i++) {
            if (used.has(i)) continue;
            const d = distance(previous[i].center, player.center);
            if (d < bestDistance) {
              bestDistance = d;
              bestIndex = i;
            }
          }
          const old = bestIndex >= 0 ? previous[bestIndex] : null;
          if (bestIndex >= 0) used.add(bestIndex);
          if (!old) return player;
          return blendPlayer(old, player, 0.36, slot);
        });

        for (let i = 0; i < previous.length; i++) {
          const old = previous[i];
          if (used.has(i) || !old || !old.visible) continue;
          if (now - (old.lastSeen || 0) > LOST_PLAYER_HOLD_MS) continue;
          smoothed.push({
            ...old,
            visible: true,
            scale: old.scale * 0.995,
            held: true
          });
        }
        return smoothed.slice(0, MAX_PLAYERS);
      }

      function blendPlayer(oldPlayer, newPlayer, amount, slot) {
        const points = {};
        for (const key of Object.keys(newPlayer.points)) {
          points[key] = lerpPoint(oldPlayer.points[key], newPlayer.points[key], amount);
        }
        return {
          ...newPlayer,
          index: slot,
          center: lerpPoint(oldPlayer.center, newPlayer.center, amount),
          scale: oldPlayer.scale + (newPlayer.scale - oldPlayer.scale) * amount,
          lastSeen: newPlayer.lastSeen || oldPlayer.lastSeen,
          held: false,
          points
        };
      }

      function drawBackground(now) {
        const t = now * 0.001;
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, "#0a5266");
        gradient.addColorStop(0.42, "#0b7a83");
        gradient.addColorStop(0.74, "#0b3d53");
        gradient.addColorStop(1, "#08212f");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.globalCompositeOperation = "screen";
        for (let i = 0; i < 8; i++) {
          const x = (i / 7) * width + Math.sin(t * 0.4 + i) * 30 * dpr;
          const rayW = (100 + i * 18) * dpr;
          const ray = ctx.createLinearGradient(x, 0, x + rayW, height);
          ray.addColorStop(0, "rgba(205, 255, 245, 0.2)");
          ray.addColorStop(0.55, "rgba(118, 242, 255, 0.06)");
          ray.addColorStop(1, "rgba(255, 230, 150, 0)");
          ctx.fillStyle = ray;
          ctx.beginPath();
          ctx.moveTo(x - rayW * 0.45, 0);
          ctx.lineTo(x + rayW * 0.45, 0);
          ctx.lineTo(x + rayW * 1.2, height);
          ctx.lineTo(x - rayW * 0.6, height);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        for (const b of bubbles) {
          b.y -= b.speed * 0.016;
          b.x += Math.sin(t + b.wobble) * 0.22 * dpr;
          if (b.y < -20 * dpr) {
            b.y = height + Math.random() * 120 * dpr;
            b.x = Math.random() * width;
          }
          ctx.strokeStyle = `rgba(${b.hue}, ${b.alpha})`;
          ctx.lineWidth = Math.max(1, dpr);
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.save();
        ctx.globalAlpha = 0.86;
        for (const k of kelp) {
          ctx.strokeStyle = k.color;
          ctx.lineWidth = k.w;
          ctx.lineCap = "round";
          ctx.beginPath();
          const baseY = height + 12 * dpr;
          ctx.moveTo(k.x, baseY);
          for (let j = 1; j <= 5; j++) {
            const yy = baseY - (k.h * j) / 5;
            const xx = k.x + Math.sin(t * 1.1 + k.phase + j * 0.75) * (10 + j * 6) * dpr;
            ctx.lineTo(xx, yy);
          }
          ctx.stroke();
        }
        ctx.restore();

        drawCoral(t);
      }

      function drawCoral(t) {
        ctx.save();
        ctx.globalAlpha = 0.82;
        const coralColors = ["#ff8ab0", "#f2cb6d", "#7ee4d8"];
        for (let i = 0; i < 12; i++) {
          const x = ((i + 0.5) / 12) * width;
          const y = height - (18 + (i % 3) * 10) * dpr;
          ctx.strokeStyle = coralColors[i % coralColors.length];
          ctx.lineWidth = (3 + (i % 2) * 2) * dpr;
          ctx.lineCap = "round";
          for (let branch = 0; branch < 3; branch++) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            const len = (26 + branch * 10 + (i % 4) * 3) * dpr;
            const dir = (branch - 1) * 0.6 + Math.sin(t + i) * 0.08;
            ctx.quadraticCurveTo(x + Math.sin(dir) * len * 0.8, y - len * 0.48, x + Math.sin(dir) * len, y - len);
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      function drawSpotlights(now, activePlayers) {
        const t = now * 0.001;
        const count = Math.max(1, activePlayers.length);
        ctx.save();
        ctx.globalCompositeOperation = "screen";
        for (let i = 0; i < count; i++) {
          const player = activePlayers[i];
          const phase = (state === "dancing" ? (now / SWAY_PERIOD_MS) * Math.PI * 2 : t * 0.55) + i * 1.35;
          const targetX = (player ? player.center.x : (i + 1) / (count + 1)) * width;
          const sourceX = targetX + Math.sin(phase) * 300 * dpr;
          const sourceY = 40 * dpr;
          const targetY = height * 0.68;
          const beamW = (270 + Math.sin(phase * 1.4) * 74) * dpr;
          const cone = ctx.createLinearGradient(sourceX, sourceY, targetX, targetY);
          cone.addColorStop(0, "rgba(255, 249, 199, 0.42)");
          cone.addColorStop(0.45, "rgba(137, 248, 255, 0.16)");
          cone.addColorStop(1, "rgba(93, 226, 255, 0)");
          ctx.fillStyle = cone;
          ctx.beginPath();
          ctx.moveTo(sourceX - 24 * dpr, sourceY);
          ctx.lineTo(sourceX + 24 * dpr, sourceY);
          ctx.lineTo(targetX + beamW, height);
          ctx.lineTo(targetX - beamW, height);
          ctx.closePath();
          ctx.fill();

          const pool = ctx.createRadialGradient(targetX, targetY, 0, targetX, targetY, beamW * 0.68);
          pool.addColorStop(0, "rgba(255, 242, 180, 0.25)");
          pool.addColorStop(0.55, "rgba(123, 243, 255, 0.1)");
          pool.addColorStop(1, "rgba(123, 243, 255, 0)");
          ctx.fillStyle = pool;
          ctx.beginPath();
          ctx.ellipse(targetX, targetY + 34 * dpr, beamW * 0.7, 72 * dpr, Math.sin(phase) * 0.12, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawShadowCharacter(player, now) {
        if (!player.visible) return;
        const t = now * 0.001;
        const color = palette[player.index % palette.length];
        const spotlight = state === "dancing" ? Math.sin((now / SWAY_PERIOD_MS) * Math.PI * 2 + player.index * 1.3) : Math.sin(t * 0.5 + player.index);
        const wobble = state === "dancing" ? spotlight : spotlight * 0.25;
        const shadowShift = wobble * 135 * dpr;
        const stretch = state === "dancing" ? 1 + Math.abs(wobble) * 0.3 : 1.02;
        const squash = state === "dancing" ? 1 - Math.abs(wobble) * 0.1 : 1;
        const bob = state === "dancing" ? Math.sin(t * 3.2 + player.index) * 10 * dpr : 0;
        const base = toScreen(player.center);
        const s = player.scale;

        drawCharacterLayer(player, base.x + shadowShift * 1.25, base.y + bob, s, stretch * 1.06, squash, 0.12, 8 * dpr, color);
        drawCharacterLayer(player, base.x + shadowShift * 0.55, base.y + bob * 0.5, s, stretch, squash, 0.24, 3 * dpr, color);
        drawCharacterLayer(player, base.x + shadowShift, base.y + bob, s, stretch, squash, 0.92, 0, color);
      }

      function drawCharacterLayer(player, cx, cy, scale, stretch, squash, alpha, blur, color) {
        const p = player.points;
        const center = toScreen(player.center);
        const map = (pt) => {
          if (!pt) return null;
          return {
            x: cx + pt.x * scale * stretch,
            y: cy + pt.y * scale * squash
          };
        };
        const pts = {};
        for (const key of Object.keys(p)) pts[key] = map(p[key]);

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.filter = blur ? `blur(${blur}px)` : "none";
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = color.body;
        ctx.fillStyle = color.body;

        const limbW = clamp(scale * 0.13, 11 * dpr, 27 * dpr);
        const torsoW = clamp(scale * 0.18, 16 * dpr, 36 * dpr);
        const headR = clamp(scale * 0.19, 18 * dpr, 44 * dpr);

        drawBlob(pts.lHip, pts.rHip, pts.lShoulder, pts.rShoulder, torsoW);
        drawSegmentedLimb(pts.lShoulder, pts.lElbow, pts.lWrist, limbW);
        drawSegmentedLimb(pts.rShoulder, pts.rElbow, pts.rWrist, limbW);
        drawSegmentedLimb(pts.lHip, pts.lKnee, pts.lAnkle, limbW);
        drawSegmentedLimb(pts.rHip, pts.rKnee, pts.rAnkle, limbW);

        const head = pts.nose || midScreen(pts.lShoulder, pts.rShoulder, 0, -headR * 1.6);
        if (head) {
          ctx.beginPath();
          ctx.arc(head.x, head.y, headR, 0, Math.PI * 2);
          ctx.fill();
          if (alpha > 0.5) {
            ctx.strokeStyle = color.edge;
            ctx.lineWidth = Math.max(2 * dpr, headR * 0.08);
            ctx.stroke();
          }
        }

        if (alpha > 0.5) {
          drawJointNodes(pts, scale, color);
          drawCartoonFace(head, headR, color);
        }
        ctx.restore();
      }

      function drawBlob(lHip, rHip, lShoulder, rShoulder, lineWidth) {
        const top = midScreen(lShoulder, rShoulder, 0, 0);
        const bottom = midScreen(lHip, rHip, 0, 0);
        if (!top || !bottom) return;
        ctx.lineWidth = lineWidth;
        ctx.beginPath();
        ctx.moveTo(top.x, top.y);
        ctx.quadraticCurveTo((top.x + bottom.x) / 2, (top.y + bottom.y) / 2, bottom.x, bottom.y);
        ctx.stroke();
      }

      function drawSegmentedLimb(a, b, c, lineWidth) {
        if (!a || !c) return;
        ctx.lineWidth = lineWidth;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        if (b) {
          ctx.lineTo(b.x, b.y);
          ctx.lineTo(c.x, c.y);
        } else {
          ctx.lineTo(c.x, c.y);
        }
        ctx.stroke();
      }

      function drawJointNodes(pts, scale, color) {
        const small = clamp(scale * 0.045, 5 * dpr, 12 * dpr);
        const midSize = clamp(scale * 0.062, 7 * dpr, 16 * dpr);
        const endSize = clamp(scale * 0.08, 9 * dpr, 20 * dpr);
        const core = "rgba(11, 18, 23, 0.96)";

        ctx.save();
        ctx.lineWidth = Math.max(2 * dpr, scale * 0.012);
        drawJoint(pts.lShoulder, small, color.edge, core);
        drawJoint(pts.rShoulder, small, color.edge, core);
        drawJoint(pts.lHip, small, color.edge, core);
        drawJoint(pts.rHip, small, color.edge, core);

        drawJoint(pts.lElbow, midSize, "rgba(125, 243, 255, 0.72)", core);
        drawJoint(pts.rElbow, midSize, "rgba(125, 243, 255, 0.72)", core);
        drawJoint(pts.lKnee, midSize, "rgba(255, 241, 154, 0.7)", core);
        drawJoint(pts.rKnee, midSize, "rgba(255, 241, 154, 0.7)", core);

        drawJoint(pts.lWrist, endSize, "rgba(255, 145, 191, 0.78)", core);
        drawJoint(pts.rWrist, endSize, "rgba(255, 145, 191, 0.78)", core);
        drawJoint(pts.lAnkle, endSize, "rgba(165, 255, 197, 0.78)", core);
        drawJoint(pts.rAnkle, endSize, "rgba(165, 255, 197, 0.78)", core);
        ctx.restore();
      }

      function drawJoint(point, radius, stroke, fill) {
        if (!point) return;
        ctx.fillStyle = fill;
        ctx.strokeStyle = stroke;
        ctx.beginPath();
        ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      function drawCartoonFace(head, headR, color) {
        if (!head) return;
        ctx.save();
        ctx.globalCompositeOperation = "screen";
        ctx.fillStyle = color.accent;
        ctx.globalAlpha = 0.32;
        ctx.beginPath();
        ctx.arc(head.x - headR * 0.34, head.y - headR * 0.08, headR * 0.12, 0, Math.PI * 2);
        ctx.arc(head.x + headR * 0.34, head.y - headR * 0.08, headR * 0.12, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawCountdown(now) {
        const elapsed = (now - startedAt) / 1000;
        if (state === "countdown") {
          const left = Math.max(0, 3 - elapsed);
          statusLabel.textContent = left > 0 ? `${Math.ceil(left)}` : "开跳";
          if (left <= 0 && !countdownDone) {
            countdownDone = true;
            state = "dancing";
            statusLabel.textContent = "舞动";
            startMusic();
          }
        }

        if (state === "countdown") {
          ctx.save();
          ctx.globalCompositeOperation = "screen";
          ctx.fillStyle = "rgba(245, 255, 252, 0.88)";
          ctx.font = `${Math.floor(92 * dpr)}px ui-sans-serif, system-ui`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(String(Math.max(1, Math.ceil(3 - elapsed))), width / 2, height / 2);
          ctx.restore();
        }
      }

      function drawIdle(now) {
        drawBackground(now);
        drawSpotlights(now, []);
      }

      function updateAudio(dt) {
        rippleCooldown -= dt;
        if (state === "dancing" && motionEnergy > 0.18 && rippleCooldown <= 0) {
          playRipple();
          rippleCooldown = 0.32 + Math.random() * 0.18;
        }
      }

      function loop(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000 || 0.016);
        lastTime = now;

        if (state === "idle") {
          drawIdle(now);
          requestAnimationFrame(loop);
          return;
        }

        updatePlayers(now);
        const activePlayers = smoothedPlayers.filter((player) => player.visible);
        motionEnergy = motionEnergy * 0.86 + Math.min(1, activePlayers.length / MAX_PLAYERS + (state === "dancing" ? 0.25 : 0)) * 0.14;

        drawBackground(now);
        drawSpotlights(now, activePlayers);
        for (const player of activePlayers) drawShadowCharacter(player, now);
        drawCountdown(now);
        updateAudio(dt);
        energyBar.style.width = `${Math.round(Math.min(1, motionEnergy) * 100)}%`;

        requestAnimationFrame(loop);
      }

      function mid(a, b) {
        if (!a && !b) return null;
        if (!a) return b;
        if (!b) return a;
        return { x: (a.x + b.x) * 0.5, y: (a.y + b.y) * 0.5, z: ((a.z || 0) + (b.z || 0)) * 0.5 };
      }

      function midScreen(a, b, offsetX, offsetY) {
        if (!a && !b) return null;
        if (!a) return { x: b.x + offsetX, y: b.y + offsetY };
        if (!b) return { x: a.x + offsetX, y: a.y + offsetY };
        return { x: (a.x + b.x) * 0.5 + offsetX, y: (a.y + b.y) * 0.5 + offsetY };
      }

      function pointBounds(points) {
        const valid = points.filter(Boolean);
        if (!valid.length) return { w: 0, h: 0 };
        let minX = Infinity;
        let maxX = -Infinity;
        let minY = Infinity;
        let maxY = -Infinity;
        for (const point of valid) {
          minX = Math.min(minX, point.x);
          maxX = Math.max(maxX, point.x);
          minY = Math.min(minY, point.y);
          maxY = Math.max(maxY, point.y);
        }
        return { w: maxX - minX, h: maxY - minY };
      }

      function completePosePoints(points, center, span) {
        const completed = { ...points };
        const template = {
          nose: { x: 0, y: -0.46 },
          lShoulder: { x: -0.22, y: -0.22 },
          rShoulder: { x: 0.22, y: -0.22 },
          lElbow: { x: -0.38, y: -0.08 },
          rElbow: { x: 0.38, y: -0.08 },
          lWrist: { x: -0.5, y: 0.08 },
          rWrist: { x: 0.5, y: 0.08 },
          lHip: { x: -0.15, y: 0.12 },
          rHip: { x: 0.15, y: 0.12 },
          lKnee: { x: -0.18, y: 0.34 },
          rKnee: { x: 0.18, y: 0.34 },
          lAnkle: { x: -0.2, y: 0.56 },
          rAnkle: { x: 0.2, y: 0.56 }
        };
        const fallback = (key) => ({
          x: center.x + template[key].x * span,
          y: center.y + template[key].y * span,
          z: 0
        });

        for (const key of ["lShoulder", "rShoulder", "lHip", "rHip"]) {
          if (!completed[key]) completed[key] = fallback(key);
        }

        completeChain(completed, "lShoulder", "lElbow", "lWrist", fallback);
        completeChain(completed, "rShoulder", "rElbow", "rWrist", fallback);
        completeChain(completed, "lHip", "lKnee", "lAnkle", fallback);
        completeChain(completed, "rHip", "rKnee", "rAnkle", fallback);

        completed.nose = points.nose || inferHead(completed.lShoulder, completed.rShoulder, span) || fallback("nose");
        for (const key of Object.keys(template)) {
          if (!completed[key]) completed[key] = fallback(key);
        }
        return completed;
      }

      function completeChain(points, rootKey, midKey, endKey, fallback) {
        const root = points[rootKey];
        const midPoint = points[midKey];
        const endPoint = points[endKey];

        if (!points[midKey] && root && endPoint) points[midKey] = lerpPoint(root, endPoint, 0.5);
        if (!points[midKey]) points[midKey] = fallback(midKey);

        if (!points[endKey] && root && points[midKey]) {
          const dx = points[midKey].x - root.x;
          const dy = points[midKey].y - root.y;
          points[endKey] = {
            x: points[midKey].x + dx * 0.92,
            y: points[midKey].y + dy * 0.92,
            z: points[midKey].z || 0
          };
        }
        if (!points[endKey]) points[endKey] = fallback(endKey);
      }

      function inferHead(leftShoulder, rightShoulder, span) {
        const shoulderCenter = mid(leftShoulder, rightShoulder);
        if (!shoulderCenter) return null;
        return {
          x: shoulderCenter.x,
          y: shoulderCenter.y - span * 0.25,
          z: shoulderCenter.z || 0
        };
      }

      function localizePoints(points, center, span) {
        const local = {};
        for (const [key, point] of Object.entries(points)) {
          local[key] = point ? { x: (point.x - center.x) / span, y: (point.y - center.y) / span } : null;
        }
        return local;
      }

      function lerpPoint(a, b, amount) {
        if (!a) return b;
        if (!b) return a;
        return { x: a.x + (b.x - a.x) * amount, y: a.y + (b.y - a.y) * amount, z: (a.z || 0) + ((b.z || 0) - (a.z || 0)) * amount };
      }

      function distance(a, b) {
        if (!a || !b) return 0;
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function toScreen(point) {
        return { x: point.x * width, y: point.y * height };
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function showPromptDetail(text) {
        promptText.textContent = text;
      }

      function shortError(message) {
        return String(message || "未知错误").replace(/\s+/g, " ").slice(0, 90);
      }

      function syncDebugVideo() {
        video.classList.toggle("debugCamera", debugMode && cameraReady);
        debugBtn.style.background = debugMode ? "rgba(54, 163, 148, 0.9)" : "";
      }

      startBtn.addEventListener("click", startCamera);
      cameraBtn.addEventListener("click", startCamera);
      demoBtn.addEventListener("click", beginDemo);
      promptDemoBtn.addEventListener("click", beginDemo);
      debugBtn.addEventListener("click", () => {
        debugMode = !debugMode;
        syncDebugVideo();
      });
      soundBtn.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? "♪" : "×";
        if (!soundEnabled && audio && audio.timer) {
          clearInterval(audio.timer);
          audio.timer = null;
        } else if (soundEnabled) {
          ensureAudio();
          if (state === "dancing") startMusic();
        }
      });

      window.addEventListener("resize", resize);
      resize();
      if (new URLSearchParams(window.location.search).has("demo")) {
        window.setTimeout(beginDemo, 250);
      }
      if (new URLSearchParams(window.location.search).has("modeltest")) {
        promptPanel.classList.remove("hidden");
        statusLabel.textContent = "测试模型";
        showPromptDetail("正在测试骨骼模型加载，不会打开摄像头。");
        loadPoseModel()
          .then(() => {
            statusLabel.textContent = "模型可用";
            showPromptDetail("骨骼模型加载成功。现在可以点击“开始”打开摄像头识别玩家骨骼。");
          })
          .catch((error) => {
            modelError = error && error.message ? error.message : "pose unavailable";
            statusLabel.textContent = "模型失败";
            showPromptDetail(`骨骼模型加载失败：${shortError(modelError)}`);
          });
      }
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
