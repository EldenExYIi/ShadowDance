<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>海底光影舞 MVP</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #061721;
        color: #eefcff;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      video {
        display: none;
      }

      .hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .bar {
        position: absolute;
        top: 16px;
        left: 16px;
        right: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .controls,
      .readout {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 8px;
        border: 1px solid rgba(177, 244, 255, 0.28);
        border-radius: 8px;
        background: rgba(3, 24, 32, 0.64);
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(12px);
      }

      button {
        appearance: none;
        border: 1px solid rgba(202, 253, 255, 0.36);
        border-radius: 6px;
        min-height: 34px;
        padding: 0 12px;
        color: #f4feff;
        background: rgba(20, 117, 124, 0.68);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }

      button:hover {
        background: rgba(33, 146, 145, 0.82);
      }

      button:disabled {
        cursor: default;
        opacity: 0.52;
      }

      .small {
        width: 34px;
        padding: 0;
        font-size: 16px;
      }

      .status {
        min-width: 86px;
        font-size: 14px;
        color: #d8fbff;
      }

      .meter {
        width: 92px;
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
      }

      .meter > span {
        display: block;
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #7df3ff, #fff19a, #ff91bf);
      }

      .centerPrompt {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(520px, calc(100vw - 32px));
        padding: 22px 22px 20px;
        border: 1px solid rgba(206, 251, 255, 0.26);
        border-radius: 8px;
        background: rgba(3, 27, 38, 0.72);
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.35);
        text-align: center;
        backdrop-filter: blur(14px);
        pointer-events: auto;
      }

      .centerPrompt h1 {
        margin: 0 0 10px;
        font-size: clamp(26px, 5vw, 44px);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .centerPrompt p {
        margin: 0 0 16px;
        color: #c8f3f7;
        font-size: 15px;
        line-height: 1.6;
      }

      .centerPrompt .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 640px) {
        .bar {
          align-items: stretch;
          flex-direction: column;
        }

        .controls,
        .readout {
          width: 100%;
          justify-content: center;
        }

        .status {
          min-width: 72px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <video id="camera" autoplay muted playsinline></video>

    <div class="hud">
      <div class="bar">
        <div class="controls">
          <button id="cameraBtn">摄像头</button>
          <button id="demoBtn">演示</button>
          <button id="calibrateBtn" disabled>取背景</button>
          <button id="soundBtn" class="small" aria-label="声音">♪</button>
        </div>
        <div class="readout">
          <span id="status" class="status">待开始</span>
          <div class="meter" aria-hidden="true"><span id="energyBar"></span></div>
        </div>
      </div>

      <section id="prompt" class="centerPrompt">
        <h1>海底光影舞</h1>
        <p>优先用人像分割裁剪玩家影子，模型不可用时再退回背景差分；3 秒后进入音乐段。</p>
        <div class="actions">
          <button id="startBtn">开始</button>
          <button id="promptDemoBtn">演示模式</button>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
    <script>
      const canvas = document.querySelector("#stage");
      const ctx = canvas.getContext("2d");
      const video = document.querySelector("#camera");
      const startBtn = document.querySelector("#startBtn");
      const cameraBtn = document.querySelector("#cameraBtn");
      const demoBtn = document.querySelector("#demoBtn");
      const promptDemoBtn = document.querySelector("#promptDemoBtn");
      const calibrateBtn = document.querySelector("#calibrateBtn");
      const soundBtn = document.querySelector("#soundBtn");
      const promptPanel = document.querySelector("#prompt");
      const statusLabel = document.querySelector("#status");
      const energyBar = document.querySelector("#energyBar");

      const DPR_LIMIT = 2;
      const PROCESS_W = 240;
      const PROCESS_H = 135;
      const MAX_PLAYERS = 4;
      const BG_WARMUP_FRAMES = 14;
      const MAX_FOREGROUND_RATIO = 0.42;
      const PERSON_SEGMENT_INTERVAL = 70;

      const processCanvas = document.createElement("canvas");
      processCanvas.width = PROCESS_W;
      processCanvas.height = PROCESS_H;
      const processCtx = processCanvas.getContext("2d", { willReadFrequently: true });

      const maskCanvas = document.createElement("canvas");
      maskCanvas.width = PROCESS_W;
      maskCanvas.height = PROCESS_H;
      const maskCtx = maskCanvas.getContext("2d");
      const maskImage = maskCtx.createImageData(PROCESS_W, PROCESS_H);

      const personMaskCanvas = document.createElement("canvas");
      personMaskCanvas.width = PROCESS_W;
      personMaskCanvas.height = PROCESS_H;
      const personMaskCtx = personMaskCanvas.getContext("2d", { willReadFrequently: true });

      const trailCanvas = document.createElement("canvas");
      const trailCtx = trailCanvas.getContext("2d");

      let width = 1;
      let height = 1;
      let dpr = 1;
      let startedAt = 0;
      let lastTime = 0;
      let state = "idle";
      let cameraReady = false;
      let demoMode = false;
      let soundEnabled = true;
      let countdownDone = false;
      let bgReady = false;
      let bgCollecting = false;
      let bgFramesNeeded = 0;
      let bgSamples = 0;
      let unstableFrames = 0;
      let framePixels = null;
      let personSegmenter = null;
      let personSegmenterReady = false;
      let personSegmenterLoading = false;
      let personSegmenterFailed = false;
      let personSegmenterBusy = false;
      let personMaskReady = false;
      let lastPersonSegmentAt = 0;
      let personMask = new Uint8Array(PROCESS_W * PROCESS_H);
      let background = new Float32Array(PROCESS_W * PROCESS_H * 3);
      let mask = new Uint8Array(PROCESS_W * PROCESS_H);
      let tempMask = new Uint8Array(PROCESS_W * PROCESS_H);
      let smoothMask = new Uint8Array(PROCESS_W * PROCESS_H);
      let previousMask = new Uint8Array(PROCESS_W * PROCESS_H);
      let visited = new Uint8Array(PROCESS_W * PROCESS_H);
      let players = [];
      let bubbles = [];
      let kelp = [];
      let motionEnergy = 0;
      let rippleCooldown = 0;
      let audio = null;
      let pointer = {
        x: 0.5,
        y: 0.5,
        lastSeen: -Infinity
      };

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, DPR_LIMIT);
        width = Math.floor(window.innerWidth * dpr);
        height = Math.floor(window.innerHeight * dpr);
        canvas.width = width;
        canvas.height = height;
        trailCanvas.width = width;
        trailCanvas.height = height;
        trailCtx.clearRect(0, 0, width, height);
        buildSceneDetails();
      }

      function buildSceneDetails() {
        bubbles = Array.from({ length: 46 }, (_, i) => ({
          x: Math.random() * width,
          y: Math.random() * height,
          r: (2 + Math.random() * 7) * dpr,
          speed: (12 + Math.random() * 38) * dpr,
          wobble: Math.random() * Math.PI * 2,
          alpha: 0.18 + Math.random() * 0.4,
          hue: i % 5 === 0 ? "255, 231, 153" : "162, 246, 255"
        }));

        kelp = Array.from({ length: 18 }, (_, i) => ({
          x: ((i + Math.random() * 0.5) / 18) * width,
          h: (95 + Math.random() * 145) * dpr,
          w: (12 + Math.random() * 15) * dpr,
          phase: Math.random() * Math.PI * 2,
          color: i % 3 === 0 ? "#2aa084" : i % 3 === 1 ? "#5aab6b" : "#288d99"
        }));
      }

      async function startCamera() {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("camera api unavailable");
          }
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              width: { ideal: 960 },
              height: { ideal: 540 },
              facingMode: "user"
            },
            audio: false
          });
          video.srcObject = stream;
          await video.play();
          cameraReady = true;
          demoMode = false;
          calibrateBtn.disabled = false;
          initPersonSegmenter();
          beginRound();
        } catch (error) {
          cameraReady = false;
          demoMode = true;
          beginRound();
        }
      }

      function beginDemo() {
        cameraReady = false;
        demoMode = true;
        calibrateBtn.disabled = true;
        beginRound();
      }

      function beginRound() {
        promptPanel.classList.add("hidden");
        startedAt = performance.now();
        lastTime = startedAt;
        state = "countdown";
        countdownDone = false;
        bgReady = false;
        bgCollecting = false;
        unstableFrames = 0;
        motionEnergy = 0;
        players = [];
        trailCtx.clearRect(0, 0, width, height);
        resetMasks();
        if (cameraReady && !demoMode) startBackgroundCapture(BG_WARMUP_FRAMES);
        if (audio && audio.timer) {
          clearInterval(audio.timer);
          audio.timer = null;
          audio.step = 0;
        }
        ensureAudio();
      }

      function ensureAudio() {
        if (audio || !soundEnabled) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctxAudio = new AudioCtx();
        const master = ctxAudio.createGain();
        master.gain.value = 0.18;
        master.connect(ctxAudio.destination);
        audio = {
          ctx: ctxAudio,
          master,
          step: 0,
          timer: null
        };
        if (ctxAudio.state === "suspended") ctxAudio.resume();
      }

      function startMusic() {
        if (!audio || audio.timer) return;
        if (audio.ctx.state === "suspended") audio.ctx.resume();
        const beatMs = 250;
        audio.timer = window.setInterval(() => {
          scheduleBeat(audio.step++);
        }, beatMs);
        scheduleBeat(audio.step++);
      }

      function scheduleBeat(step) {
        if (!audio || !soundEnabled) return;
        const t = audio.ctx.currentTime;
        if (step % 4 === 0) playKick(t);
        if (step % 2 === 1) playHat(t);
        if (step % 8 === 0 || step % 8 === 3) playPluck(t, step % 8 === 0 ? 196 : 247);
      }

      function playKick(t) {
        const osc = audio.ctx.createOscillator();
        const gain = audio.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(120, t);
        osc.frequency.exponentialRampToValueAtTime(42, t + 0.16);
        gain.gain.setValueAtTime(0.72, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        osc.connect(gain).connect(audio.master);
        osc.start(t);
        osc.stop(t + 0.2);
      }

      function playHat(t) {
        const buffer = audio.ctx.createBuffer(1, audio.ctx.sampleRate * 0.045, audio.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const noise = audio.ctx.createBufferSource();
        const filter = audio.ctx.createBiquadFilter();
        const gain = audio.ctx.createGain();
        noise.buffer = buffer;
        filter.type = "highpass";
        filter.frequency.value = 5200;
        gain.gain.setValueAtTime(0.16, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
        noise.connect(filter).connect(gain).connect(audio.master);
        noise.start(t);
      }

      function playPluck(t, freq) {
        const osc = audio.ctx.createOscillator();
        const gain = audio.ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0, t);
        gain.gain.linearRampToValueAtTime(0.18, t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        osc.connect(gain).connect(audio.master);
        osc.start(t);
        osc.stop(t + 0.24);
      }

      function playRipple() {
        if (!audio || !soundEnabled) return;
        const t = audio.ctx.currentTime;
        const osc = audio.ctx.createOscillator();
        const filter = audio.ctx.createBiquadFilter();
        const gain = audio.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(380 + Math.random() * 160, t);
        osc.frequency.exponentialRampToValueAtTime(160 + Math.random() * 60, t + 0.38);
        filter.type = "lowpass";
        filter.frequency.value = 900;
        gain.gain.setValueAtTime(0.0, t);
        gain.gain.linearRampToValueAtTime(0.22, t + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
        osc.connect(filter).connect(gain).connect(audio.master);
        osc.start(t);
        osc.stop(t + 0.44);
      }

      function calibrateBackground() {
        if (!cameraReady) return;
        startBackgroundCapture(BG_WARMUP_FRAMES);
      }

      function sampleCameraFrame(forceBackground) {
        if (!cameraReady || video.readyState < 2) return;
        if (forceBackground) startBackgroundCapture(BG_WARMUP_FRAMES);
        processCtx.save();
        processCtx.translate(PROCESS_W, 0);
        processCtx.scale(-1, 1);
        processCtx.drawImage(video, 0, 0, PROCESS_W, PROCESS_H);
        processCtx.restore();
        framePixels = processCtx.getImageData(0, 0, PROCESS_W, PROCESS_H);
        const data = framePixels.data;

        if (!personSegmenterFailed) {
          initPersonSegmenter();
          requestPersonSegmentation(performance.now());
          if (personSegmenterReady && personMaskReady) {
            bgCollecting = false;
            bgReady = true;
            unstableFrames = 0;
            if (applyPersonMask()) statusLabel.textContent = "AI人像";
            return;
          }
          if (personSegmenterReady || personSegmenterLoading || personSegmenterBusy) {
            resetMasks();
            trailCtx.clearRect(0, 0, width, height);
            statusLabel.textContent = personSegmenterReady ? "入镜" : "加载人像";
            return;
          }
        }

        if (bgCollecting || !bgReady) {
          collectBackgroundFrame(data);
          return;
        }

        let active = 0;
        let changed = 0;
        for (let i = 0, px = 0, p = 0; i < data.length; i += 4, px++, p += 3) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          const br = background[p];
          const bg = background[p + 1];
          const bb = background[p + 2];
          const dr = Math.abs(r - br);
          const dg = Math.abs(g - bg);
          const db = Math.abs(b - bb);
          const luma = r * 0.299 + g * 0.587 + b * 0.114;
          const bgLuma = br * 0.299 + bg * 0.587 + bb * 0.114;
          const colorDiff = Math.max(dr, dg, db);
          const lumaDiff = Math.abs(luma - bgLuma);
          const diff = colorDiff * 0.62 + lumaDiff * 0.38;
          const isFg = diff > 26;
          mask[px] = isFg ? 255 : 0;
          if (isFg) active++;
          if (mask[px] !== previousMask[px]) changed++;

          const learn = isFg ? 0.002 : 0.026;
          background[p] = background[p] * (1 - learn) + r * learn;
          background[p + 1] = background[p + 1] * (1 - learn) + g * learn;
          background[p + 2] = background[p + 2] * (1 - learn) + b * learn;
        }

        const foregroundRatio = active / (PROCESS_W * PROCESS_H);
        if (foregroundRatio > MAX_FOREGROUND_RATIO) {
          unstableFrames++;
          resetMasks();
          trailCtx.clearRect(0, 0, width, height);
          statusLabel.textContent = unstableFrames > 1 ? "重取背景" : "稳画面";
          if (unstableFrames > 1) startBackgroundCapture(8);
          return;
        }
        unstableFrames = 0;

        softenMask();
        findPlayers();
        updateMaskImage();
        motionEnergy = motionEnergy * 0.78 + Math.min(1, changed / (PROCESS_W * PROCESS_H * 0.16)) * 0.22;
        previousMask.set(smoothMask);
      }

      function resetMasks() {
        mask.fill(0);
        tempMask.fill(0);
        smoothMask.fill(0);
        previousMask.fill(0);
        players = [];
        motionEnergy = 0;
        maskCtx.clearRect(0, 0, PROCESS_W, PROCESS_H);
        personMask.fill(0);
        personMaskReady = false;
      }

      function initPersonSegmenter() {
        if (personSegmenterReady || personSegmenterLoading || personSegmenterFailed) return;
        if (!window.SelfieSegmentation) {
          personSegmenterFailed = true;
          statusLabel.textContent = "背景差分";
          return;
        }

        personSegmenterLoading = true;
        statusLabel.textContent = "加载人像";
        try {
          personSegmenter = new SelfieSegmentation({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
          });
          personSegmenter.setOptions({
            modelSelection: 1,
            selfieMode: false
          });
          personSegmenter.onResults((results) => {
            if (!results || !results.segmentationMask) {
              personSegmenterBusy = false;
              return;
            }
          personMaskCtx.clearRect(0, 0, PROCESS_W, PROCESS_H);
          personMaskCtx.drawImage(results.segmentationMask, 0, 0, PROCESS_W, PROCESS_H);
          const data = personMaskCtx.getImageData(0, 0, PROCESS_W, PROCESS_H).data;
          let alphaMin = 255;
          let alphaMax = 0;
          let rgbMax = 0;
          for (let i = 0; i < data.length; i += 4) {
            const rgb = (data[i] + data[i + 1] + data[i + 2]) / 3;
            alphaMin = Math.min(alphaMin, data[i + 3]);
            alphaMax = Math.max(alphaMax, data[i + 3]);
            rgbMax = Math.max(rgbMax, rgb);
          }
          const alphaHasMask = alphaMax - alphaMin > 30 && alphaMin < 240;
          const useAlphaMask = alphaHasMask || rgbMax < 8;
          let active = 0;
          for (let i = 0, px = 0; i < data.length; i += 4, px++) {
              const rgbConfidence = (data[i] + data[i + 1] + data[i + 2]) / 3;
              const confidence = useAlphaMask ? data[i + 3] : rgbConfidence;
              const isPerson = confidence > 52;
              personMask[px] = isPerson ? 255 : 0;
              if (isPerson) active++;
            }
            personMaskReady = active > 120;
            personSegmenterReady = true;
            personSegmenterLoading = false;
            personSegmenterBusy = false;
          });
        } catch (error) {
          personSegmenterFailed = true;
          personSegmenterLoading = false;
          personSegmenterBusy = false;
          statusLabel.textContent = "背景差分";
        }
      }

      function requestPersonSegmentation(now) {
        if (!personSegmenter || personSegmenterFailed || personSegmenterBusy) return;
        if (now - lastPersonSegmentAt < PERSON_SEGMENT_INTERVAL) return;
        lastPersonSegmentAt = now;
        personSegmenterBusy = true;
        personSegmenter
          .send({ image: processCanvas })
          .catch(() => {
            personSegmenterFailed = true;
            personSegmenterLoading = false;
            personSegmenterBusy = false;
            personMaskReady = false;
            statusLabel.textContent = "背景差分";
          });
      }

      function applyPersonMask() {
        let changed = 0;
        let active = 0;
        for (let i = 0; i < personMask.length; i++) {
          const value = personMask[i];
          mask[i] = value;
          if (value) active++;
          if (value !== previousMask[i]) changed++;
        }

        if (active / (PROCESS_W * PROCESS_H) > 0.72) {
          resetMasks();
          trailCtx.clearRect(0, 0, width, height);
          statusLabel.textContent = "稳画面";
          return false;
        }

        softenMask();
        findPlayers();
        updateMaskImage();
        motionEnergy = motionEnergy * 0.78 + Math.min(1, changed / (PROCESS_W * PROCESS_H * 0.16)) * 0.22;
        previousMask.set(smoothMask);
        return true;
      }

      function startBackgroundCapture(frameCount) {
        bgReady = false;
        bgCollecting = true;
        bgFramesNeeded = frameCount;
        bgSamples = 0;
        unstableFrames = 0;
        background.fill(0);
        resetMasks();
        trailCtx.clearRect(0, 0, width, height);
        statusLabel.textContent = "取背景";
      }

      function collectBackgroundFrame(data) {
        let meanLuma = 0;
        for (let i = 0; i < data.length; i += 4) {
          meanLuma += data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
        }
        meanLuma /= PROCESS_W * PROCESS_H;

        if (meanLuma < 6) {
          statusLabel.textContent = "等画面";
          return;
        }

        for (let i = 0, p = 0; i < data.length; i += 4, p += 3) {
          background[p] += data[i];
          background[p + 1] += data[i + 1];
          background[p + 2] += data[i + 2];
        }

        bgSamples++;
        const left = Math.max(0, bgFramesNeeded - bgSamples);
        statusLabel.textContent = left > 0 ? `取背景 ${left}` : "入镜";

        if (bgSamples < bgFramesNeeded) return;

        for (let p = 0; p < background.length; p++) {
          background[p] /= bgSamples;
        }
        bgReady = true;
        bgCollecting = false;
        resetMasks();
      }

      function softenMask() {
        const w = PROCESS_W;
        const h = PROCESS_H;
        tempMask.fill(0);
        smoothMask.fill(0);

        for (let y = 1; y < h - 1; y++) {
          for (let x = 1; x < w - 1; x++) {
            const idx = y * w + x;
            if (!mask[idx]) continue;
            tempMask[idx] = 255;
            tempMask[idx - 1] = 255;
            tempMask[idx + 1] = 255;
            tempMask[idx - w] = 255;
            tempMask[idx + w] = 255;
          }
        }

        for (let y = 1; y < h - 1; y++) {
          for (let x = 1; x < w - 1; x++) {
            const idx = y * w + x;
            let sum = 0;
            sum += tempMask[idx] ? 1 : 0;
            sum += tempMask[idx - 1] ? 1 : 0;
            sum += tempMask[idx + 1] ? 1 : 0;
            sum += tempMask[idx - w] ? 1 : 0;
            sum += tempMask[idx + w] ? 1 : 0;
            sum += tempMask[idx - w - 1] ? 1 : 0;
            sum += tempMask[idx - w + 1] ? 1 : 0;
            sum += tempMask[idx + w - 1] ? 1 : 0;
            sum += tempMask[idx + w + 1] ? 1 : 0;
            smoothMask[idx] = sum >= 4 ? 245 : 0;
          }
        }
      }

      function findPlayers() {
        visited.fill(0);
        const found = [];
        const w = PROCESS_W;
        const h = PROCESS_H;
        const stack = [];

        for (let y = 1; y < h - 1; y++) {
          for (let x = 1; x < w - 1; x++) {
            const start = y * w + x;
            if (!smoothMask[start] || visited[start]) continue;
            let count = 0;
            let sx = 0;
            let sy = 0;
            let minX = x;
            let maxX = x;
            let minY = y;
            let maxY = y;
            stack.length = 0;
            stack.push(start);
            visited[start] = 1;

            while (stack.length) {
              const idx = stack.pop();
              const cx = idx % w;
              const cy = Math.floor(idx / w);
              count++;
              sx += cx;
              sy += cy;
              minX = Math.min(minX, cx);
              maxX = Math.max(maxX, cx);
              minY = Math.min(minY, cy);
              maxY = Math.max(maxY, cy);

              const neighbors = [idx - 1, idx + 1, idx - w, idx + w];
              for (let i = 0; i < neighbors.length; i++) {
                const next = neighbors[i];
                if (next < 0 || next >= smoothMask.length || visited[next] || !smoothMask[next]) continue;
                visited[next] = 1;
                stack.push(next);
              }
            }

            const boxW = maxX - minX + 1;
            const boxH = maxY - minY + 1;
            if (count > 180 && boxW > 10 && boxH > 18) {
              found.push({
                x: sx / count / w,
                y: sy / count / h,
                size: count,
                box: [
                  Math.max(0, minX - 4) / w,
                  Math.max(0, minY - 4) / h,
                  Math.min(w, maxX + 5) / w,
                  Math.min(h, maxY + 5) / h
                ]
              });
            }
          }
        }

        found.sort((a, b) => b.size - a.size);
        players = found.slice(0, MAX_PLAYERS);
      }

      function updateMaskImage() {
        const data = maskImage.data;
        for (let i = 0, p = 0; i < smoothMask.length; i++, p += 4) {
          const alpha = smoothMask[i];
          data[p] = 22;
          data[p + 1] = 27;
          data[p + 2] = 32;
          data[p + 3] = alpha;
        }
        maskCtx.putImageData(maskImage, 0, 0);
      }

      function updateDemo(now, dt) {
        players = [];
        smoothMask.fill(0);
        const t = now * 0.001;
        const count = 3;
        for (let i = 0; i < count; i++) {
          const baseX = (i + 1) / (count + 1);
          const pointerLive = i === 0 && now - pointer.lastSeen < 2400;
          const x = pointerLive ? pointer.x : baseX + Math.sin(t * 1.35 + i * 1.7) * 0.055;
          const y = pointerLive ? pointer.y : 0.5 + Math.cos(t * 1.1 + i) * 0.07;
          players.push({ x, y, size: 1200, box: [x - 0.08, y - 0.24, x + 0.08, y + 0.22] });
          stampDemoBody(x, y, t + i);
        }
        updateMaskImage();
        motionEnergy = 0.5 + Math.sin(t * 2.4) * 0.22;
      }

      function stampDemoBody(nx, ny, t) {
        const cx = Math.floor(nx * PROCESS_W);
        const cy = Math.floor(ny * PROCESS_H);
        const rx = 9 + Math.sin(t * 2.2) * 2;
        const ry = 24;
        for (let y = -30; y <= 26; y++) {
          for (let x = -18; x <= 18; x++) {
            const sway = Math.sin(t * 2 + y * 0.08) * 5;
            const ax = x + sway;
            const body = ax * ax / (rx * rx) + y * y / (ry * ry) < 1;
            const head = (x * x + (y + 31) * (y + 31)) < 52;
            const armL = Math.abs(y + 5) < 4 && Math.abs(x + 18 + Math.sin(t * 4) * 8) < 12;
            const armR = Math.abs(y + 2) < 4 && Math.abs(x - 18 + Math.cos(t * 4) * 8) < 12;
            if (!(body || head || armL || armR)) continue;
            const px = cx + x;
            const py = cy + y;
            if (px >= 0 && px < PROCESS_W && py >= 0 && py < PROCESS_H) {
              smoothMask[py * PROCESS_W + px] = 220;
            }
          }
        }
      }

      function updateAudio(dt) {
        rippleCooldown -= dt;
        if (state === "dancing" && motionEnergy > 0.2 && rippleCooldown <= 0) {
          playRipple();
          rippleCooldown = 0.28 + Math.random() * 0.22;
        }
      }

      function drawBackground(now) {
        const t = now * 0.001;
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, "#0a5266");
        gradient.addColorStop(0.4, "#0b7a83");
        gradient.addColorStop(0.74, "#0b3d53");
        gradient.addColorStop(1, "#08212f");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.globalCompositeOperation = "screen";
        for (let i = 0; i < 8; i++) {
          const x = (i / 7) * width + Math.sin(t * 0.4 + i) * 30 * dpr;
          const rayW = (100 + i * 18) * dpr;
          const ray = ctx.createLinearGradient(x, 0, x + rayW, height);
          ray.addColorStop(0, "rgba(205, 255, 245, 0.26)");
          ray.addColorStop(0.5, "rgba(118, 242, 255, 0.07)");
          ray.addColorStop(1, "rgba(255, 230, 150, 0)");
          ctx.fillStyle = ray;
          ctx.beginPath();
          ctx.moveTo(x - rayW * 0.45, 0);
          ctx.lineTo(x + rayW * 0.45, 0);
          ctx.lineTo(x + rayW * 1.2, height);
          ctx.lineTo(x - rayW * 0.6, height);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        ctx.save();
        for (const b of bubbles) {
          b.y -= b.speed * 0.016;
          b.x += Math.sin(t + b.wobble) * 0.22 * dpr;
          if (b.y < -20 * dpr) {
            b.y = height + Math.random() * 120 * dpr;
            b.x = Math.random() * width;
          }
          ctx.strokeStyle = `rgba(${b.hue}, ${b.alpha})`;
          ctx.lineWidth = Math.max(1, dpr);
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = 0.86;
        for (const k of kelp) {
          ctx.strokeStyle = k.color;
          ctx.lineWidth = k.w;
          ctx.lineCap = "round";
          ctx.beginPath();
          const baseY = height + 12 * dpr;
          ctx.moveTo(k.x, baseY);
          for (let j = 1; j <= 5; j++) {
            const yy = baseY - (k.h * j) / 5;
            const xx = k.x + Math.sin(t * 1.1 + k.phase + j * 0.75) * (10 + j * 6) * dpr;
            ctx.lineTo(xx, yy);
          }
          ctx.stroke();
        }
        ctx.restore();

        drawCoral(t);
      }

      function drawCoral(t) {
        ctx.save();
        ctx.globalAlpha = 0.82;
        const coralColors = ["#ff8ab0", "#f2cb6d", "#7ee4d8"];
        for (let i = 0; i < 12; i++) {
          const x = ((i + 0.5) / 12) * width;
          const y = height - (18 + (i % 3) * 10) * dpr;
          ctx.strokeStyle = coralColors[i % coralColors.length];
          ctx.lineWidth = (3 + (i % 2) * 2) * dpr;
          ctx.lineCap = "round";
          for (let branch = 0; branch < 3; branch++) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            const len = (26 + branch * 10 + (i % 4) * 3) * dpr;
            const dir = (branch - 1) * 0.6 + Math.sin(t + i) * 0.08;
            ctx.quadraticCurveTo(
              x + Math.sin(dir) * len * 0.8,
              y - len * 0.48,
              x + Math.sin(dir) * len,
              y - len
            );
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      function drawShadowCrop(targetCtx, player, alpha, blur, scale, drift) {
        const box = player.box;
        const sx = Math.max(0, Math.floor(box[0] * PROCESS_W));
        const sy = Math.max(0, Math.floor(box[1] * PROCESS_H));
        const sw = Math.max(1, Math.min(PROCESS_W - sx, Math.ceil((box[2] - box[0]) * PROCESS_W)));
        const sh = Math.max(1, Math.min(PROCESS_H - sy, Math.ceil((box[3] - box[1]) * PROCESS_H)));
        const screenX = (sx / PROCESS_W) * width;
        const screenY = (sy / PROCESS_H) * height;
        const screenW = (sw / PROCESS_W) * width;
        const screenH = (sh / PROCESS_H) * height;
        const scaledW = screenW * scale;
        const scaledH = screenH * scale;
        const dx = screenX - (scaledW - screenW) * 0.5 + drift;
        const dy = screenY - (scaledH - screenH) * 0.52;

        targetCtx.save();
        targetCtx.globalAlpha = alpha;
        targetCtx.filter = blur ? `blur(${blur * dpr}px)` : "none";
        targetCtx.drawImage(maskCanvas, sx, sy, sw, sh, dx, dy, scaledW, scaledH);
        targetCtx.restore();
      }

      function drawShadows(now) {
        const drift = Math.sin(now * 0.0018) * 5 * dpr;

        trailCtx.save();
        trailCtx.globalCompositeOperation = "destination-out";
        trailCtx.fillStyle = "rgba(0, 0, 0, 0.38)";
        trailCtx.fillRect(0, 0, width, height);
        trailCtx.globalCompositeOperation = "source-over";
        for (const p of players) {
          drawShadowCrop(trailCtx, p, 0.18, 5, 1.05, -drift * 0.55);
          drawShadowCrop(trailCtx, p, 0.08, 0, 1.0, 0);
        }
        trailCtx.restore();

        ctx.save();
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 0.42;
        ctx.drawImage(trailCanvas, 0, 0);
        ctx.restore();

        ctx.save();
        ctx.globalCompositeOperation = "source-over";
        for (const p of players) {
          drawShadowCrop(ctx, p, 0.82, 1.0, 1.015, drift);
          drawShadowCrop(ctx, p, 0.54, 0, 1.0, 0);
        }
        ctx.restore();
      }

      function drawCountdown(now) {
        const elapsed = (now - startedAt) / 1000;
        if (state === "countdown") {
          const left = Math.max(0, 3 - elapsed);
          statusLabel.textContent = left > 0 ? `${Math.ceil(left)}` : "开跳";
          if (left <= 0 && !countdownDone) {
            countdownDone = true;
            state = "dancing";
            statusLabel.textContent = "舞动";
            startMusic();
          }
        }

        if (state === "countdown") {
          ctx.save();
          ctx.globalCompositeOperation = "screen";
          ctx.fillStyle = "rgba(245, 255, 252, 0.88)";
          ctx.font = `${Math.floor(92 * dpr)}px ui-sans-serif, system-ui`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(String(Math.max(1, Math.ceil(3 - elapsed))), width / 2, height / 2);
          ctx.restore();
        }
      }

      function drawIdle(now) {
        drawBackground(now);
        ctx.save();
        ctx.globalCompositeOperation = "screen";
        ctx.fillStyle = "rgba(210, 255, 250, 0.2)";
        ctx.beginPath();
        ctx.arc(width * 0.5, height * 0.48, Math.min(width, height) * 0.28, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function loop(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000 || 0.016);
        lastTime = now;

        if (state === "idle") {
          drawIdle(now);
          requestAnimationFrame(loop);
          return;
        }

        if (demoMode) {
          updateDemo(now, dt);
        } else {
          sampleCameraFrame(false);
          if (cameraReady && bgReady && players.length === 0 && state === "dancing") {
            statusLabel.textContent = "入镜";
          } else if (state === "dancing") {
            statusLabel.textContent = `${players.length} 人`;
          }
        }

        drawBackground(now);
        drawShadows(now);
        updateAudio(dt);
        drawCountdown(now);
        energyBar.style.width = `${Math.round(Math.min(1, motionEnergy) * 100)}%`;

        requestAnimationFrame(loop);
      }

      startBtn.addEventListener("click", startCamera);
      cameraBtn.addEventListener("click", startCamera);
      demoBtn.addEventListener("click", beginDemo);
      promptDemoBtn.addEventListener("click", beginDemo);
      calibrateBtn.addEventListener("click", calibrateBackground);
      window.addEventListener("pointermove", (event) => {
        pointer.x = event.clientX / Math.max(1, window.innerWidth);
        pointer.y = event.clientY / Math.max(1, window.innerHeight);
        pointer.lastSeen = performance.now();
      });
      soundBtn.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? "♪" : "×";
        if (!soundEnabled && audio && audio.timer) {
          clearInterval(audio.timer);
          audio.timer = null;
        } else if (soundEnabled) {
          ensureAudio();
          if (state === "dancing") startMusic();
        }
      });

      window.addEventListener("resize", resize);
      resize();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
